name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. 1.0.0, without "v" prefix)
        required: true
        type: string

env:
  JAVA_VERSION: "17"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  android-release:
    name: Android — APK + AAB
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v6

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set version
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Restore google-services.json
        run: |
          echo "${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}" > androidApp/google-services.json

      - uses: gradle/actions/setup-gradle@v4

      - name: Update version
        run: |
          sed -i "s/versionCode = .*/versionCode = ${GITHUB_RUN_NUMBER}/" androidApp/build.gradle.kts
          sed -i "s/versionName = .*/versionName = \"${RELEASE_VERSION}\"/" androidApp/build.gradle.kts

      - name: Assemble release APK
        run: ./gradlew :androidApp:assembleRelease

      - name: Build release AAB
        run: ./gradlew :androidApp:bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: androidApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  desktop-macos:
    name: Desktop — macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set version
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Update package version
        run: |
          sed -i '' "s/packageVersion = .*/packageVersion = \"${RELEASE_VERSION}\"/" desktopApp/build.gradle.kts

      - name: Create macOS distributable
        run: ./gradlew :desktopApp:createDistributable

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-dmg
          path: desktopApp/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error

  desktop-windows:
    name: Desktop — Windows MSI
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set version
        run: |
          $version = "${{ inputs.version || github.ref_name }}" -replace '^v', ''
          echo "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: gradle/actions/setup-gradle@v4

      - name: Update package version
        run: |
          (Get-Content desktopApp/build.gradle.kts) -replace 'packageVersion = ".*"', "packageVersion = `"$env:RELEASE_VERSION`"" | Set-Content desktopApp/build.gradle.kts

      - name: Create Windows distributable
        run: ./gradlew :desktopApp:createDistributable

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-msi
          path: desktopApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

  desktop-linux:
    name: Desktop — Linux DEB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set version
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Update package version
        run: |
          sed -i "s/packageVersion = .*/packageVersion = \"${RELEASE_VERSION}\"/" desktopApp/build.gradle.kts

      - name: Create Linux distributable
        run: ./gradlew :desktopApp:createDistributable

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-deb
          path: desktopApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    needs: [ android-release, desktop-macos, desktop-windows, desktop-linux ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: artifacts/**/*
          fail_on_unmatched_files: true
          generate_release_notes: true
